<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Lumen Input</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; color: #f2f3f5;
    font-family: "SamsungOne", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body.showing { background: transparent; }
  body.showing #ui { display: none; }
  #ui { padding: 72px 110px; }
  h1 { margin: 0 0 6px; font-size: 46px; } h1 span { color: #e50914; }
  p.sub { margin: 0 0 34px; font-size: 24px; color: #8b91a1; }
  .src { margin-bottom: 26px; }
  .src h2 { font-size: 26px; margin: 0 0 12px; }
  .row { display: flex; gap: 18px; }
  .btn { padding: 20px 26px; border-radius: 14px; background: #12141a; border: 2px solid #262a35; font-size: 24px; min-width: 330px; }
  .btn small { display: block; color: #8b91a1; font-size: 18px; margin-top: 6px; }
  .btn.focused { border-color: #fff; background: #1a1d25; }
  #status { position: absolute; left: 110px; right: 110px; bottom: 60px; font-size: 24px; color: #8b91a1;
    font-family: Menlo, Consolas, monospace; white-space: pre-wrap; }
  #busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 34px; background: #07080b; }
  body.silent #busy { display: flex; } body.silent #ui { display: none; }
</style>
</head>
<body>
<div id="busy">Switching input…</div>
<div id="ui">
  <h1>Lumen Input</h1>
  <p class="sub">Pick an input and a method to test switching. Back returns to where you came from.</p>
  <div id="list">Reading inputs…</div>
</div>
<div id="status"></div>
<script>
// Self-updating loader. Runs the helper logic from the newest commit (cached
// from the previous launch so the switch stays instant), refreshes that commit
// in the background for next time, and falls back to the packaged app.js.
(function () {
  var REPO = 'giannecarlos-cmd/tizenbrew-launcher';
  var KEY = 'xdi.sha';
  function load(src, onError) {
    var s = document.createElement('script');
    s.src = src;
    if (onError) s.onerror = onError;
    document.body.appendChild(s);
  }
  function local() { load('app.js'); }
  var sha = null;
  try { sha = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
  if (sha && /^[0-9a-f]{40}$/.test(sha)) {
    load('https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/helper/xd-input/app.js', local);
    setTimeout(function () { if (!window.__xdInputStarted) local(); }, 2500); // slow network
  } else {
    local();
  }
  try {
    fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { Accept: 'application/vnd.github.sha' }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { t = String(t).trim(); if (/^[0-9a-f]{40}$/.test(t)) localStorage.setItem(KEY, t); })
      .catch(function () { /* offline: keep the cached commit */ });
  } catch (e) { /* fetch unavailable */ }
})();
</script>
</body>
</html>
