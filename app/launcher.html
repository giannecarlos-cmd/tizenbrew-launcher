<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>XD Launcher</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; color: #f2f3f5; font-family: Arial, sans-serif; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #8b91a1; }
</style>
</head>
<body>
<div id="boot">Loading XD Launcher…</div>
<div id="root"></div>
<script>
// Stable loader. The TV's web view caches this page, so it stays tiny and never
// needs to change: it pulls the real markup, styles and script with a unique
// query string on every launch, so updates always show up.
(function () {
  var v = Date.now();
  var base = location.href.split('?')[0].replace(/[^\/]*$/, '');
  function fail(msg) { document.getElementById('boot').textContent = 'Could not load launcher: ' + msg; }

  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = base + 'main.css?v=' + v;
  document.head.appendChild(css);

  fetch(base + 'body.html?v=' + v, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      document.getElementById('root').innerHTML = html;
      var s = document.createElement('script');
      s.src = base + 'main.js?v=' + v;
      s.onload = function () { var b = document.getElementById('boot'); if (b) b.parentNode.removeChild(b); };
      s.onerror = function () { fail('main.js'); };
      document.body.appendChild(s);
    })
    .catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
