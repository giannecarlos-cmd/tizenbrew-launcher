<!-- Living wallpaper: time-of-day sky, a drifting sun/moon light, slow
     shimmer, and a soft light that follows the focused tile. -->
<div id="wall" aria-hidden="true">
  <div class="sky"></div>
  <div class="orb"></div>
  <div class="shimmer shimmer-a"></div>
  <div class="shimmer shimmer-b"></div>
  <div class="focuslight"></div>
</div>

<header class="topbar">
  <div class="mark"><span class="mark-dot"></span>Lumen</div>
  <div class="glance">
    <span class="chip" id="chipBedtime" hidden></span>
    <span class="chip" id="chipWeather" hidden></span>
    <span class="clock"><span id="day"></span><span id="time"></span></span>
  </div>
</header>

<main id="home">
  <!-- Stage: one context-aware moment (bedtime, pick up where you left off, TV box). -->
  <section class="stage" id="stage">
    <div class="scene scene-tide" aria-hidden="true">
      <div class="glow"></div>
      <svg class="swell swell-1" viewBox="0 0 2400 400" preserveAspectRatio="none"><path d="M0 220 C 300 160 500 280 800 220 S 1300 160 1600 220 S 2100 280 2400 220 V400 H0 Z"/></svg>
      <svg class="swell swell-2" viewBox="0 0 2400 400" preserveAspectRatio="none"><path d="M0 250 C 260 210 520 300 820 250 S 1340 200 1620 250 S 2140 300 2400 250 V400 H0 Z"/></svg>
      <div class="sparkle"></div>
    </div>
    <div class="scene scene-art" aria-hidden="true">
      <canvas class="art-wash" width="5" height="5"></canvas>
      <div class="art-icon"></div>
    </div>
    <div class="stage-copy">
      <p class="stage-kicker" id="stageKicker"></p>
      <h1 class="stage-title" id="stageTitle"></h1>
      <p class="stage-sub" id="stageSub"></p>
      <div class="stage-actions" id="stageActions"></div>
    </div>
  </section>

  <div id="shelves"></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>
