<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>XD Launcher · Diagnostics</title>
<style>
  :root {
    --bg: #07080b;
    --panel: #12141a;
    --panel-2: #1a1d25;
    --line: #262a35;
    --text: #f2f3f5;
    --muted: #8b91a1;
    --accent: #e50914;
    --ok: #2fbf71;
    --warn: #f0b429;
    --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "SamsungOne", "Samsung Sharp Sans", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body { padding: 56px 96px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .status { font-size: 22px; color: var(--muted); }
  .status b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; background: var(--warn); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--accent); }
  h2 { font-size: 26px; font-weight: 600; margin: 28px 0 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
  #scroller { position: absolute; left: 96px; right: 96px; top: 150px; bottom: 110px; overflow: hidden; }
  #content { transition: transform 180ms ease-out; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; }
  .card { width: 316px; min-height: 120px; padding: 16px 18px; border-radius: 14px; background: var(--panel);
    border: 2px solid var(--line); display: flex; gap: 16px; align-items: center;
    transition: transform 140ms ease-out, border-color 140ms, background 140ms; }
  .card img, .card .ph { width: 72px; height: 72px; border-radius: 12px; flex: 0 0 72px; object-fit: cover; background: var(--panel-2); }
  .card .ph { display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: var(--muted); }
  .card .meta { min-width: 0; }
  .card .name { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .id { font-size: 16px; color: var(--muted); margin-top: 6px; word-break: break-all; font-family: Menlo, Consolas, monospace; }
  .card .tag { display: inline-block; margin-top: 8px; font-size: 14px; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
  .card.target .tag.found { background: rgba(47,191,113,.18); color: var(--ok); }
  .card.target .tag.missing { background: rgba(229,9,20,.18); color: #ff6b72; }
  .card.hidden-app { opacity: .7; }
  .card.focused { border-color: var(--focus); background: var(--panel-2); transform: scale(1.04); }
  footer { position: absolute; left: 96px; right: 96px; bottom: 36px; display: flex; justify-content: space-between;
    font-size: 20px; color: var(--muted); }
  .key { display: inline-block; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); margin: 0 6px 0 18px; color: var(--text); }
  .key.yellow { border-color: #c9a400; color: #f0d000; }
  .key.blue { border-color: #2a5bd7; color: #6f9bff; }
  #toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); padding: 14px 26px; border-radius: 12px;
    background: #20232d; border: 1px solid var(--line); font-size: 22px; opacity: 0; transition: opacity 200ms; }
  #toast.show { opacity: 1; }
  #empty { font-size: 24px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><span>XD</span> Launcher · Diagnostics</h1>
  <div class="status" id="status"><span class="dot"></span>Starting service…</div>
</header>

<div id="scroller"><div id="content">
  <h2>Launcher targets</h2>
  <div class="row" id="targets"></div>
  <h2 id="allTitle">All installed apps</h2>
  <div class="row" id="all"><div id="empty">Waiting for the app list…</div></div>
</div></div>

<footer>
  <div>Arrows move · <span class="key">OK</span>launch
    <span class="key yellow">Yellow</span>show hidden apps
    <span class="key blue">Blue</span>reload</div>
  <div id="lastKey">Last key: none</div>
</footer>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var API = 'http://127.0.0.1:8190';

  // What the real launcher needs. Matched by name, case-insensitive.
  var TARGETS = [
    { label: 'Samsung TV Plus', match: ['tv plus', 'tvplus'] },
    { label: 'TELUS box (HDMI input)', match: ['tv viewer', 'tv-viewer', 'source', 'input'], ids: ['org.tizen.tv-viewer'] },
    { label: 'Netflix', match: ['netflix'] },
    { label: 'Disney+', match: ['disney'] },
    { label: 'Prime Video', match: ['prime video', 'amazon'] },
    { label: 'Crave', match: ['crave'] },
    { label: 'YouTube', match: ['youtube'] },
    { label: 'CosmoGO', match: ['cosmo', 'cineplex'] },
    { label: 'Free Games', match: ['free games', 'freegames'] }
  ];

  var state = { apps: [], showHidden: false, focus: 0 };
  var $ = function (id) { return document.getElementById(id); };

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'show';
    clearTimeout(toast._h);
    toast._h = setTimeout(function () { t.className = ''; }, 3200);
  }

  function setStatus(kind, html) {
    $('status').innerHTML = '<span class="dot ' + kind + '"></span>' + html;
  }

  function get(path) {
    return fetch(API + path, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j && j.error ? j.error : 'HTTP ' + r.status);
        return j;
      });
    });
  }

  // The service can take a few seconds to start after the module opens.
  function waitForService(tries) {
    return get('/ping').catch(function (e) {
      if (tries <= 0) throw e;
      return new Promise(function (res) { setTimeout(res, 1000); }).then(function () { return waitForService(tries - 1); });
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function iconHtml(app) {
    if (app && app.iconPath) {
      return '<img src="' + API + '/icon?path=' + encodeURIComponent(app.iconPath) + '" alt="" onerror="this.outerHTML=\'<div class=ph>' +
        esc((app.name || '?').charAt(0)) + '</div>\'">';
    }
    return '<div class="ph">' + esc(((app && app.name) || '?').charAt(0)) + '</div>';
  }

  function findTarget(t) {
    var hits = [];
    state.apps.forEach(function (a) {
      var n = String(a.name || '').toLowerCase();
      var id = String(a.id || '').toLowerCase();
      var byId = t.ids && t.ids.indexOf(a.id) >= 0;
      var byName = t.match.some(function (m) { return n.indexOf(m) >= 0 || id.indexOf(m.replace(/ /g, '')) >= 0; });
      if (byId || byName) hits.push(a);
    });
    hits.sort(function (x, y) { return (y.show ? 1 : 0) - (x.show ? 1 : 0); });
    return hits;
  }

  function card(app, extraClass, tagHtml, labelOverride) {
    var cls = 'card focusable' + (extraClass ? ' ' + extraClass : '') + (app && !app.show ? ' hidden-app' : '');
    var name = labelOverride || (app ? app.name : '');
    return '<div class="' + cls + '" data-id="' + esc(app ? app.id : '') + '" data-name="' + esc(name) + '">' +
      iconHtml(app || { name: name }) +
      '<div class="meta"><div class="name">' + esc(name) + '</div>' +
      '<div class="id">' + esc(app ? app.id : 'not found on this TV') + '</div>' +
      (tagHtml || '') + '</div></div>';
  }

  function render() {
    var t = TARGETS.map(function (tg) {
      var hits = findTarget(tg);
      if (!hits.length) return card(null, 'target', '<span class="tag missing">Not found</span>', tg.label);
      var extra = hits.length > 1 ? ' · ' + (hits.length - 1) + ' more match' + (hits.length > 2 ? 'es' : '') : '';
      return card(hits[0], 'target', '<span class="tag found">' + esc(tg.label) + extra + '</span>');
    }).join('');
    $('targets').innerHTML = t;

    var list = state.apps.filter(function (a) { return state.showHidden || a.show; })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    $('allTitle').textContent = (state.showHidden ? 'All installed apps, including hidden' : 'All visible apps') +
      ' (' + list.length + ')';
    $('all').innerHTML = list.length ? list.map(function (a) {
      return card(a, '', a.show ? '' : '<span class="tag">hidden</span>');
    }).join('') : '<div id="empty">No apps returned.</div>';

    var items = focusables();
    if (state.focus >= items.length) state.focus = 0;
    applyFocus();
  }

  function focusables() { return Array.prototype.slice.call(document.querySelectorAll('.focusable')); }

  function applyFocus() {
    var items = focusables();
    items.forEach(function (el, i) { el.classList.toggle('focused', i === state.focus); });
    var el = items[state.focus];
    if (!el) return;
    var scroller = $('scroller');
    var content = $('content');
    var top = el.offsetTop;
    var view = scroller.clientHeight;
    var maxShift = Math.max(0, content.scrollHeight - view);
    var shift = Math.min(maxShift, Math.max(0, top - view / 3));
    content.style.transform = 'translateY(' + (-shift) + 'px)';
  }

  // Spatial navigation: pick the nearest card in the pressed direction.
  function move(dir) {
    var items = focusables();
    var cur = items[state.focus];
    if (!cur) return;
    var a = cur.getBoundingClientRect();
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var best = -1, bestScore = Infinity;
    items.forEach(function (el, i) {
      if (i === state.focus) return;
      var b = el.getBoundingClientRect();
      var bx = b.left + b.width / 2, by = b.top + b.height / 2;
      var dx = bx - ax, dy = by - ay;
      var ok = (dir === 'left' && dx < -5) || (dir === 'right' && dx > 5) || (dir === 'up' && dy < -5) || (dir === 'down' && dy > 5);
      if (!ok) return;
      var primary = (dir === 'left' || dir === 'right') ? Math.abs(dx) : Math.abs(dy);
      var cross = (dir === 'left' || dir === 'right') ? Math.abs(dy) : Math.abs(dx);
      var score = primary + cross * 3;
      if (score < bestScore) { bestScore = score; best = i; }
    });
    if (best >= 0) { state.focus = best; applyFocus(); }
  }

  function launchFocused() {
    var el = focusables()[state.focus];
    if (!el) return;
    var id = el.getAttribute('data-id');
    var name = el.getAttribute('data-name');
    if (!id) { toast(name + ' is not installed on this TV.'); return; }
    toast('Opening ' + name + '…');
    get('/launch?id=' + encodeURIComponent(id))
      .then(function () { toast('Launched ' + name); })
      .catch(function (e) { toast('Could not open ' + name + ': ' + e.message); });
  }

  function load() {
    setStatus('', 'Connecting to service…');
    return waitForService(15)
      .then(function () { return get('/info'); })
      .then(function (info) {
        setStatus('ok', 'Service <b>v' + esc(info.serviceVersion) + '</b> · ' + esc(info.model || 'unknown model') +
          ' · Tizen <b>' + esc(info.platformVersion || '?') + '</b>');
        return get('/apps');
      })
      .then(function (data) { state.apps = data.apps || []; render(); })
      .catch(function (e) {
        setStatus('bad', 'Service unavailable: ' + esc(e.message));
        $('all').innerHTML = '<div id="empty">The launcher service did not respond. Close TizenBrew fully and open it again.</div>';
      });
  }

  var KEY = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };
  document.addEventListener('keydown', function (e) {
    $('lastKey').textContent = 'Last key: ' + (e.key || '?') + ' (' + e.keyCode + ')';
    if (KEY[e.keyCode]) { e.preventDefault(); move(KEY[e.keyCode]); return; }
    if (e.keyCode === 13) { e.preventDefault(); launchFocused(); return; }
    if (e.keyCode === 405) { state.showHidden = !state.showHidden; state.focus = 0; render(); return; } // Yellow
    if (e.keyCode === 406) { load(); return; } // Blue
  });

  load();
})();
</script>
</body>
</html>
